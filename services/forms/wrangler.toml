# Local/staging copy only. The production `massic-forms` Worker is deployed
# exclusively from the r-and-c-roofing repository.
name = "massic-forms-rebellious-aging-dev"
main = "src/index.ts"
compatibility_date = "2026-01-15"
workers_dev = true

# Replace database_id after: npx wrangler d1 create massic-forms
[[d1_databases]]
binding = "DB"
database_name = "massic-forms"
database_id = "376bc987-bf24-4f8c-88e0-64ce2daacf61"

# Safe to commit. Local secrets (RESEND_API_KEY, TURNSTILE_SECRET_REBELLIOUS_AGING)
# go in .dev.vars. Do not `wrangler deploy` or `wrangler secret put` from this copy —
# production `massic-forms` is maintained in another repository.
[vars]
RESEND_FROM = "Rebellious Aging <hello@rebelliousaging.org>"
# Notify emails per site per UTC day. Extra leads still save; visitor still sees success.
RESEND_DAILY_LIMIT = "100"
